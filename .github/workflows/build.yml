name: Build CloudStream plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
        continue-on-error: true

      - name: Prepare builds branch
        shell: bash
        run: |
          mkdir -p builds
          find builds -maxdepth 1 -type f -name '*.cs3' -delete

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugin
        shell: bash
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew make makePluginsJson --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Gradle failed; retrying in $delay seconds..."
              sleep "$delay"
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Validate CloudStream package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          package = Path("TurkiyeTV/build/TurkiyeTV.cs3")
          generated = Path("build/plugins.json")

          if not package.is_file() or package.stat().st_size == 0:
              raise SystemExit("VALIDATION FAILED: TurkiyeTV.cs3 yok veya boş.")

          entries = json.loads(generated.read_text(encoding="utf-8"))
          if not isinstance(entries, list) or len(entries) != 1:
              raise SystemExit("VALIDATION FAILED: build/plugins.json tek plugin kaydı içermiyor.")

          entry = entries[0]
          data = package.read_bytes()
          actual_hash = hashlib.sha256(data).hexdigest()
          expected_hash = str(entry.get("fileHash", "")).removeprefix("sha256-")

          if expected_hash != actual_hash:
              raise SystemExit("VALIDATION FAILED: plugins.json SHA-256 paketi eşleşmiyor.")
          if int(entry.get("fileSize", -1)) != len(data):
              raise SystemExit("VALIDATION FAILED: plugins.json dosya boyutu paketi eşleşmiyor.")
          if entry.get("internalName") != "TurkiyeTV":
              raise SystemExit("VALIDATION FAILED: internalName TurkiyeTV değil.")
          if int(entry.get("version", -1)) != 4:
              raise SystemExit(f"VALIDATION FAILED: beklenmeyen plugin sürümü: {entry.get('version')}.")

          with zipfile.ZipFile(package) as archive:
              bad_file = archive.testzip()
              if bad_file is not None:
                  raise SystemExit(f"VALIDATION FAILED: ZIP bozuk: {bad_file}")
              names = set(archive.namelist())
              required = {"manifest.json", "classes.dex"}
              missing = required - names
              if missing:
                  raise SystemExit(f"VALIDATION FAILED: pakette eksik dosya: {sorted(missing)}")
              manifest = json.loads(archive.read("manifest.json"))

          if manifest.get("pluginClassName") != "com.eikosa.turkiyetv.TurkiyeTVPlugin":
              raise SystemExit("VALIDATION FAILED: manifest pluginClassName yanlış.")
          if int(manifest.get("version", -1)) != int(entry["version"]):
              raise SystemExit("VALIDATION FAILED: manifest ve katalog sürümü farklı.")
          if manifest.get("name") != entry.get("name"):
              raise SystemExit("VALIDATION FAILED: manifest ve katalog adı farklı.")

          expected_url = "https://raw.githubusercontent.com/Eikosa/tv/builds/TurkiyeTV.cs3"
          if entry.get("url") != expected_url:
              raise SystemExit("VALIDATION FAILED: katalog plugin URL'si yanlış.")

          print(f"VALIDATION PASSED: {package} | {len(data)} bytes | sha256-{actual_hash}")

          PY

      - name: Publish builds branch
        shell: bash
        run: |
          cp TurkiyeTV/build/*.cs3 builds/
          cp build/plugins.json builds/
          cd builds
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build ${GITHUB_SHA}" || true
          git branch -M builds
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
