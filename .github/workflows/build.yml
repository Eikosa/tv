name: Build CloudStream plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

concurrency:
  group: cloudstream-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
        continue-on-error: true

      - name: Prepare builds branch
        shell: bash
        run: |
          mkdir -p builds
          find builds -maxdepth 1 -type f -name '*.cs3' -delete

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugin
        shell: bash
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew make makePluginsJson --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Gradle failed; retrying in $delay seconds..."
              sleep "$delay"
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Validate CloudStream package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path

          package = Path("TurkiyeTV/build/TurkiyeTV.cs3")
          generated = Path("build/plugins.json")
          build_config = Path("TurkiyeTV/build.gradle.kts").read_text(encoding="utf-8")
          version_match = re.search(r"(?m)^version\s*=\s*(\d+)", build_config)
          if not version_match:
              raise SystemExit("VALIDATION FAILED: build.gradle.kts sürümü okunamadı.")
          expected_version = int(version_match.group(1))

          if not package.is_file() or package.stat().st_size == 0:
              raise SystemExit("VALIDATION FAILED: TurkiyeTV.cs3 yok veya boş.")

          entries = json.loads(generated.read_text(encoding="utf-8"))
          if not isinstance(entries, list) or len(entries) != 1:
              raise SystemExit("VALIDATION FAILED: build/plugins.json tek plugin kaydı içermiyor.")

          entry = entries[0]
          data = package.read_bytes()
          actual_hash = hashlib.sha256(data).hexdigest()
          expected_hash = str(entry.get("fileHash", "")).removeprefix("sha256-")

          if expected_hash != actual_hash:
              raise SystemExit("VALIDATION FAILED: plugins.json SHA-256 paketi eşleşmiyor.")
          if int(entry.get("fileSize", -1)) != len(data):
              raise SystemExit("VALIDATION FAILED: plugins.json dosya boyutu paketi eşleşmiyor.")
          if entry.get("internalName") != "TurkiyeTV":
              raise SystemExit("VALIDATION FAILED: internalName TurkiyeTV değil.")
          if int(entry.get("version", -1)) != expected_version:
              raise SystemExit(f"VALIDATION FAILED: beklenmeyen plugin sürümü: {entry.get('version')}.")

          with zipfile.ZipFile(package) as archive:
              bad_file = archive.testzip()
              if bad_file is not None:
                  raise SystemExit(f"VALIDATION FAILED: ZIP bozuk: {bad_file}")
              names = set(archive.namelist())
              required = {"manifest.json", "classes.dex"}
              missing = required - names
              if missing:
                  raise SystemExit(f"VALIDATION FAILED: pakette eksik dosya: {sorted(missing)}")
              manifest = json.loads(archive.read("manifest.json"))

          if manifest.get("pluginClassName") != "com.eikosa.turkiyetv.TurkiyeTVPlugin":
              raise SystemExit("VALIDATION FAILED: manifest pluginClassName yanlış.")
          if int(manifest.get("version", -1)) != int(entry["version"]):
              raise SystemExit("VALIDATION FAILED: manifest ve katalog sürümü farklı.")
          if manifest.get("name") != entry.get("name"):
              raise SystemExit("VALIDATION FAILED: manifest ve katalog adı farklı.")

          expected_url = "https://raw.githubusercontent.com/Eikosa/tv/builds/TurkiyeTV.cs3"
          if entry.get("url") != expected_url:
              raise SystemExit("VALIDATION FAILED: katalog plugin URL'si yanlış.")

          playlist_lines = Path("turkiye_ulusal_tv.m3u").read_text(encoding="utf-8").splitlines()
          playlist_entries = []
          for index, line in enumerate(playlist_lines):
              if not line.startswith("#EXTINF"):
                  continue
              match_id = re.search(r'tvg-id="([^"]+)"', line)
              match_group = re.search(r'group-title="([^"]+)"', line)
              name = line.rsplit(",", 1)[-1].strip()
              cursor = index + 1
              while cursor < len(playlist_lines) and not playlist_lines[cursor].strip():
                  cursor += 1
              stream_url = playlist_lines[cursor].strip() if cursor < len(playlist_lines) else ""
              if not match_id or not match_group or not stream_url.startswith(("http://", "https://")):
                  raise SystemExit(f"VALIDATION FAILED: eksik M3U alanı: {name}")
              if "youtube.com" in stream_url or "youtu.be" in stream_url:
                  raise SystemExit(f"VALIDATION FAILED: M3U içinde YouTube sayfası var: {name}")
              playlist_entries.append((name, match_id.group(1), stream_url))

          if len(playlist_entries) < 190:
              raise SystemExit(f"VALIDATION FAILED: M3U kanal sayısı düşük: {len(playlist_entries)}")
          for field_index, field_name in enumerate(("ad", "tvg-id", "adres")):
              values = [item[field_index] for item in playlist_entries]
              duplicates = sorted({value for value in values if values.count(value) > 1})
              if duplicates:
                  raise SystemExit(f"VALIDATION FAILED: yinelenen M3U {field_name}: {duplicates}")

          print(f"VALIDATION PASSED: {package} | {len(data)} bytes | sha256-{actual_hash}")

          PY

      - name: Publish builds branch
        shell: bash
        run: |
          cp TurkiyeTV/build/*.cs3 builds/
          cp build/plugins.json builds/
          cp repo.json builds/
          cd builds
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build ${GITHUB_SHA}" || true
          git branch -M builds
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync repository catalog to main
        shell: bash
        run: |
          cp build/plugins.json plugins.json
          if ! git diff --quiet plugins.json; then
            echo "Syncing plugins.json on main..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins.json
            git commit -m "Sync catalog metadata [skip ci]"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin main
          else
            echo "plugins.json already up to date on main."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge CDN caches
        shell: bash
        run: |
          echo "Purging jsDelivr edge caches..."
          for path in \
            "gh/${GITHUB_REPOSITORY}@builds/plugins.json" \
            "gh/${GITHUB_REPOSITORY}@builds/TurkiyeTV.cs3" \
            "gh/${GITHUB_REPOSITORY}@builds/repo.json" \
            "gh/${GITHUB_REPOSITORY}@main/plugins.json" \
            "gh/${GITHUB_REPOSITORY}@main/repo.json"; do
            echo "Purging https://purge.jsdelivr.net/$path"
            curl -sf "https://purge.jsdelivr.net/$path" || true
          done

      - name: Verify remote deployment integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          nonce = int(time.time())
          builds_plugins_url = f"https://raw.githubusercontent.com/{repo}/builds/plugins.json?check={nonce}"

          print(f"Checking remote catalog at {builds_plugins_url}...")
          catalog = None
          for attempt in range(1, 6):
              try:
                  with urllib.request.urlopen(builds_plugins_url, timeout=15) as res:
                      catalog = json.loads(res.read().decode("utf-8"))
                  break
              except Exception as err:
                  if attempt == 5:
                      raise SystemExit(f"REMOTE VERIFICATION FAILED: {err}")
                  time.sleep(2 * attempt)

          entry = catalog[0]
          expected_hash = entry["fileHash"].removeprefix("sha256-")
          expected_size = int(entry["fileSize"])
          cs3_url = f"{entry['url']}?check={nonce}"

          print(f"Downloading remote package from {cs3_url}...")
          cs3_data = b""
          for attempt in range(1, 6):
              try:
                  with urllib.request.urlopen(cs3_url, timeout=20) as res:
                      cs3_data = res.read()
                  break
              except Exception as err:
                  if attempt == 5:
                      raise SystemExit(f"REMOTE VERIFICATION FAILED: {err}")
                  time.sleep(2 * attempt)

          actual_hash = hashlib.sha256(cs3_data).hexdigest()
          actual_size = len(cs3_data)

          if actual_hash != expected_hash:
              raise SystemExit(f"REMOTE VERIFICATION FAILED: SHA-256 mismatch! Expected {expected_hash}, got {actual_hash}")
          if actual_size != expected_size:
              raise SystemExit(f"REMOTE VERIFICATION FAILED: Size mismatch! Expected {expected_size}, got {actual_size}")

          print(f"REMOTE INTEGRITY VERIFIED: {actual_size} bytes, sha256-{actual_hash}")
          PY

