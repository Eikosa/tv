name: Build CloudStream plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
        continue-on-error: true

      - name: Prepare builds branch
        shell: bash
        run: |
          mkdir -p builds
          find builds -maxdepth 1 -type f -name '*.cs3' -delete

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugin
        shell: bash
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew make makePluginsJson --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Gradle failed; retrying in $delay seconds..."
              sleep "$delay"
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Publish builds branch
        shell: bash
        run: |
          cd builds
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build ${GITHUB_SHA}" || true
          git branch -M builds
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
